    - variable: sphum
      longname: specific humidity
      units: kg/kg
      profile_type: fixed
      subparams:
      - surface_value: 3.0e-06
    - variable: liq_wat
      longname: cloud liquid specific humidity
      units: kg/kg
    - variable: ice_wat
      longname: cloud ice water specific humidity
      units: kg/kg
    - variable: cld_amt
      longname: cloud fraction
      units: none
    - variable: liq_drp
      longname: cloud droplet
