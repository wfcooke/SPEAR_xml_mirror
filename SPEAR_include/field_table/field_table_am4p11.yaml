      convection: all
      profile_type: fixed
      subparams:
      - surface_value: 1.0e-32
      dry_deposition: wind_driven
      subparams:
      - surfr: 100.0
      wet_deposition: aerosol_below
      subparams:
      - frac_incloud: 0.2
        frac_incloud_uw: 0.3
        frac_incloud_donner: 0.3
        frac_incloud_snow: 0.0
        alphar: 0.001
        alphas: 0.001
      radiative_param: online
      subparams:
      - name_in_rad_mod: omphilic
        name_in_clim_mod: organic_carbon
